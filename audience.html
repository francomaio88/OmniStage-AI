<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OmniStage AI · Audiencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
:root {
  --bg: #1d262d;
  --bg-card: rgba(18, 25, 41, 0.7);
  --ink: #f8fafc;
  --muted: #94a3b8;
  --accent-cyan: #00F2FE;
  --accent-magenta: #4FACFE;
  --line: rgba(79, 172, 254, 0.2);
  --live: #10b981;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background-color: #1d262d; }
body {
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  background-color: #1d262d;
  background-image: none;
  color: var(--ink);
}
.wrap {
  width: min(900px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 2rem 0 3rem;
}
header {
  margin-bottom: 1.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: .55rem;
}
.brand {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .7rem;
  max-width: 100%;
  line-height: 0;
  background: transparent;
  box-shadow: none;
  border: 0;
  text-decoration: none;
}
.brand img {
  height: clamp(36px, 8vw, 52px);
  width: auto;
  max-width: min(220px, 70vw);
  object-fit: contain;
  object-position: center;
  display: block;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  mix-blend-mode: normal;
}
.lede { color: var(--muted); margin: 0; font-size: 0.9rem; max-width: 36rem; }
.toolbar { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; margin-bottom: 1.5rem; background: var(--bg-card); padding: 1rem; border-radius: 12px; border: 1px solid var(--line); backdrop-filter: blur(10px); }
@media (max-width: 720px) { .toolbar { grid-template-columns: 1fr; } }
label { display: block; font-size: .75rem; color: var(--accent-magenta); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
select, input[type="text"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--ink); border-radius: 8px; padding: .7rem .85rem; font: 500 .95rem "IBM Plex Sans", sans-serif; transition: border-color 0.3s; }
select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent-cyan); }
button { border: 1px solid var(--accent-cyan); background: rgba(0, 242, 254, 0.1); color: var(--accent-cyan); border-radius: 8px; padding: .7rem 1.2rem; font: 600 .9rem "IBM Plex Sans", sans-serif; cursor: pointer; align-self: end; height: 44px; transition: all 0.3s; }
button:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
.status { font-family: "IBM Plex Mono", monospace; font-size: .8rem; color: var(--muted); margin: 0 0 1rem; display: flex; align-items: center; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; background: #334155; margin-right: .5rem; }
.dot.on { background: var(--live); box-shadow: 0 0 10px var(--live); }
.board { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; min-height: 55vh; padding: 2rem; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); overflow-y: auto; scroll-behavior: smooth; }
.empty { color: var(--muted); margin: 0; text-align: center; font-style: italic; padding-top: 2rem; }
.item { margin: 0 0 1.5rem; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.item:last-child { margin-bottom: 0; }
.meta { font-family: "IBM Plex Mono", monospace; font-size: .75rem; color: var(--accent-magenta); margin-bottom: .4rem; opacity: 0.8; }
.orig { font-size: 1.3rem; line-height: 1.5; margin: 0 0 .3rem; font-weight: 500; }
.tr { font-size: 1.1rem; line-height: 1.5; margin: 0; color: #cbd5e1; }
body[data-lang="original"] .tr, body[data-lang="translated"] .orig { display: none; }
body[data-order="translated_first"] .item { display: flex; flex-direction: column; }
body[data-order="translated_first"] .meta { order: 0; }
body[data-order="translated_first"] .tr { order: 1; font-size: 1.3rem; color: #fff; font-weight: 500; }
body[data-order="translated_first"] .orig { order: 2; font-size: 1.1rem; color: #cbd5e1; }
body.obs[data-order="translated_first"] .tr { font-size: clamp(1.6rem, 4vw, 2.8rem); font-weight: 700; color: #fff; }
body.obs[data-order="translated_first"] .orig { font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 500; color: #fdf5e6; margin-top: 0.2rem; }
footer { margin-top: 1.5rem; color: var(--muted); font-size: .85rem; text-align: center; }
footer a { color: var(--accent-cyan); text-decoration: none; }

/* Variante Browser Source / OBS Studio - Flotante, transparente y alto contraste */
html.obs, body.obs { background: transparent !important; background-color: transparent !important; overflow: hidden; }
body.obs .wrap { width: min(940px, calc(100% - 2rem)); max-width: 940px; padding: 0; margin: 0 auto; position: absolute; bottom: 4%; left: 0; right: 0; background: transparent !important; pointer-events: none; }
body.obs header, body.obs .toolbar, body.obs .status, body.obs footer, body.obs .empty { display: none !important; }
body.obs .board { background: transparent !important; background-color: transparent !important; border: 0 !important; min-height: 0 !important; padding: 0 !important; box-shadow: none !important; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 0.35rem; overflow: hidden; max-width: 100%; }

/* Contorno negro grueso y sombra para legibilidad total sobre fondos claros u oscuros */
body.obs .orig, body.obs .tr {
  text-shadow:
    0 2px 4px #000,
    0 0 12px rgba(0,0,0,1),
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    2px 2px 0 #000,
    -3px 0 0 #000,
    3px 0 0 #000,
    0 -3px 0 #000,
    0 3px 0 #000;
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  letter-spacing: -0.01em;
  margin: 0 auto;
  max-width: 880px;
  word-break: break-word;
  overflow-wrap: anywhere;
  text-wrap: balance;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
body.obs .meta { display: none !important; }

/* Colores: Amarillo de transmisión para el principal, Blanco para el secundario */
body.obs .orig { color: #FFE600 !important; font-weight: 700; line-height: 1.25; }
body.obs .tr { color: #FFFFFF !important; font-weight: 600; line-height: 1.3; margin-top: 0.2rem; }

/* Si el usuario elige orden Traducido arriba / Original abajo: */
body.obs[data-order="translated_first"] .item { display: flex; flex-direction: column; }
body.obs[data-order="translated_first"] .tr { order: 1; color: #FFE600 !important; font-weight: 700; margin-top: 0; }
body.obs[data-order="translated_first"] .orig { order: 2; color: #FFFFFF !important; font-weight: 600; margin-top: 0.2rem; }

/* Jerarquía visual en OBS: Lo último arriba (grande y 100%), únicamente una línea previa abajo como eco sutil */
body.obs .item { width: 100%; max-width: 880px; margin: 0 auto 0.25rem; text-align: center; transition: all 0.25s ease-out; transform-origin: center top; }
body.obs .item:nth-child(1) {
  opacity: 1;
  transform: scale(1);
}
body.obs .item:nth-child(1) .orig {
  font-size: clamp(1.8rem, 4.4vw, 3rem);
}
body.obs .item:nth-child(1) .tr {
  font-size: clamp(1.3rem, 3.2vw, 2.15rem);
}
body.obs[data-order="translated_first"] .item:nth-child(1) .tr {
  font-size: clamp(1.8rem, 4.4vw, 3rem);
}
body.obs[data-order="translated_first"] .item:nth-child(1) .orig {
  font-size: clamp(1.3rem, 3.2vw, 2.15rem);
}

/* Eco anterior único: mucho más compacto y con 48% de opacidad */
body.obs .item:nth-child(2) {
  opacity: 0.48;
  transform: scale(0.88);
}
body.obs .item:nth-child(2) .orig {
  font-size: clamp(1.05rem, 2.3vw, 1.45rem);
  font-weight: 600;
}
body.obs .item:nth-child(2) .tr {
  font-size: clamp(0.85rem, 1.8vw, 1.15rem);
  font-weight: 500;
}
body.obs[data-order="translated_first"] .item:nth-child(2) .tr {
  font-size: clamp(1.05rem, 2.3vw, 1.45rem);
  font-weight: 600;
}
body.obs[data-order="translated_first"] .item:nth-child(2) .orig {
  font-size: clamp(0.85rem, 1.8vw, 1.15rem);
  font-weight: 500;
}

/* Ocultar ABSOLUTAMENTE cualquier 3er o 4to mensaje para eliminar ruido visual (máximo 2 líneas) */
body.obs .item:nth-child(n+3) {
  display: none !important;
}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/"><img src="/logo.png" alt="OmniStage AI"/></a>
      <p class="lede">Transcripción en vivo · el overlay de OBS no cambia</p>
    </header>

    <div class="toolbar">
      <div>
        <label for="stage">Escenario</label>
        <select id="stage">
          <option value="nerdearla-main" selected>nerdearla-main</option>
          <option value="nerdearla-sala-2">nerdearla-sala-2</option>
          <option value="nerdearla-workshop">nerdearla-workshop</option>
          <option value="__custom">Otro (escribir abajo)</option>
        </select>
        <input id="stageCustom" type="text" placeholder="stage_id personalizado" style="display:none;margin-top:.45rem"/>
      </div>
      <div>
        <label for="lang">Idioma</label>
        <select id="lang">
          <option value="both" selected>Ambos</option>
          <option value="original">Original</option>
          <option value="translated">Traducido</option>
        </select>
      </div>
      <div>
        <label for="order">Posición</label>
        <select id="order">
          <option value="original_first" selected>Original arriba</option>
          <option value="translated_first">Traducido arriba</option>
        </select>
      </div>
      <button id="obsToggle" type="button">Modo OBS</button>
    </div>

    <p class="status"><i class="dot" id="dot"></i><span id="state">Sin conexión</span></p>

    <section class="board" id="board" aria-live="polite">
      <p class="empty" id="empty">Esperando al emisor de este escenario…</p>
    </section>

    <footer>
      Emisor: <a href="/broadcaster">/broadcaster</a>
      · OBS: agregá <code>?obs=1&amp;stage=nerdearla-main&amp;lang=both</code> a esta URL.
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const DEFAULT_STAGES = ["nerdearla-main", "nerdearla-sala-2", "nerdearla-workshop"];

    const stageSelect = $("stage");
    const stageCustom = $("stageCustom");
    const langSelect = $("lang");
    const orderSelect = $("order");
    const board = $("board");
    const empty = $("empty");

    let ws = null;
    let reconnectTimer = null;
    let currentStage = "";

    function applyLang(value) {
      document.body.dataset.lang = value;
    }

    function applyOrder(value) {
      document.body.dataset.order = value;
    }

    function currentStageId() {
      if (stageSelect.value === "__custom") {
        return (stageCustom.value || "default").trim();
      }
      return stageSelect.value;
    }

    function setObs(on, pushUrl) {
      document.body.classList.toggle("obs", on);
      $("obsToggle").textContent = on ? "Salir de OBS" : "Modo OBS";
      if (pushUrl) {
        const next = new URL(location.href);
        if (on) next.searchParams.set("obs", "1");
        else next.searchParams.delete("obs");
        next.searchParams.set("stage", currentStageId());
        next.searchParams.set("lang", langSelect.value);
        next.searchParams.set("order", orderSelect.value);
        history.replaceState(null, "", next);
      }
    }

    function setState(text, on) {
      $("state").textContent = text;
      $("dot").classList.toggle("on", !!on);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function splitSubtitleText(text, maxChars = 65) {
      text = (text || "").trim();
      if (!text || text.length <= maxChars) return text ? [text] : [];
      const words = text.split(/\s+/);
      const chunks = [];
      let current = [];
      let currentLen = 0;
      for (const word of words) {
        const candLen = currentLen + (current.length ? 1 : 0) + word.length;
        const hasPunctuation = current.length > 0 && /[,;:.?!]$/.test(current[current.length - 1]) && currentLen >= 35;
        if (candLen > maxChars || hasPunctuation) {
          if (current.length) {
            chunks.push(current.join(" "));
            current = [word];
            currentLen = word.length;
          } else {
            chunks.push(word);
            current = [];
            currentLen = 0;
          }
        } else {
          current.push(word);
          currentLen = candLen;
        }
      }
      if (current.length) {
        const lastStr = current.join(" ");
        if (chunks.length > 0 && lastStr.length < 12 && (chunks[chunks.length - 1].length + 1 + lastStr.length <= maxChars + 10)) {
          chunks[chunks.length - 1] += " " + lastStr;
        } else {
          chunks.push(lastStr);
        }
      }
      return chunks;
    }

    function createItemElement(msgPart) {
      const item = document.createElement("article");
      item.className = "item";
      const when = msgPart.ts ? new Date(msgPart.ts * 1000).toLocaleTimeString() : "";
      item.innerHTML = `
        <div class="meta">${escapeHtml(msgPart.stage_id || "")} · ${escapeHtml(msgPart.source_lang || "")}→${escapeHtml(msgPart.target_lang || "")} · ${when}</div>
        <p class="orig">${escapeHtml(msgPart.original)}</p>
        <p class="tr">${escapeHtml(msgPart.translated || "")}</p>
      `;
      return item;
    }

    // Cola FIFO de reproducción secuencial para evitar "ráfagas" y encimado con baja latencia
    const subtitleQueue = [];
    let queueTimer = null;
    let lastDisplayTimestamp = 0;
    const MIN_READING_INTERVAL_MS = 700; // 0.7s para aparición rápida y dinámica

    function processQueueTick() {
      queueTimer = null;
      if (subtitleQueue.length === 0) return;

      const now = Date.now();
      const elapsed = now - lastDisplayTimestamp;
      const pace = subtitleQueue.length > 2 ? 600 : MIN_READING_INTERVAL_MS;

      if (elapsed < pace) {
        queueTimer = setTimeout(processQueueTick, pace - elapsed);
        return;
      }

      const nextItem = subtitleQueue.shift();
      if (!nextItem) return;

      lastDisplayTimestamp = Date.now();
      displaySingleCaption(nextItem);

      if (subtitleQueue.length > 0) {
        const nextPace = subtitleQueue.length > 2 ? 600 : MIN_READING_INTERVAL_MS;
        queueTimer = setTimeout(processQueueTick, nextPace);
      }
    }

    function displaySingleCaption(msgPart) {
      empty.style.display = "none";
      const item = createItemElement(msgPart);
      board.prepend(item);

      const allItems = board.querySelectorAll(".item");
      while (allItems.length > 30) {
        allItems[allItems.length - 1].remove();
      }
      if (!document.body.classList.contains("obs")) {
        board.scrollTop = 0;
      }
    }

    function pushCaption(msg) {
      if (!msg.original && !msg.translated) return;

      const origChunks = splitSubtitleText(msg.original, 65);
      const transChunks = splitSubtitleText(msg.translated, 65);
      const count = Math.max(origChunks.length, transChunks.length, 1);

      for (let i = 0; i < count; i++) {
        const o = origChunks[i] || (origChunks.length === 1 ? origChunks[0] : "");
        const t = transChunks[i] || (transChunks.length === 1 ? transChunks[0] : "");
        if (!o && !t) continue;

        // FIFO: Se encolan al final en orden estricto de llegada
        subtitleQueue.push({
          stage_id: msg.stage_id,
          source_lang: msg.source_lang,
          target_lang: msg.target_lang,
          original: o,
          translated: t,
          ts: (msg.ts || Date.now() / 1000) + (i * 0.05)
        });
      }

      // Si la cola se desborda (>8 elementos), descartar los más viejos para evitar lag acumulado
      if (subtitleQueue.length > 8) {
        subtitleQueue.splice(0, subtitleQueue.length - 8);
      }

      if (!queueTimer) {
        processQueueTick();
      }
    }

    function wsUrl(stageId) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return `${proto}://${location.host}/ws/audience/${encodeURIComponent(stageId)}`;
    }

    function disconnect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (ws) {
        ws.onclose = null;
        try { ws.close(); } catch (_) { /* ignore */ }
        ws = null;
      }
    }

    function connect() {
      const stageId = currentStageId();
      currentStage = stageId;
      disconnect();
      setState(`conectando a ${stageId}…`, false);
      ws = new WebSocket(wsUrl(stageId));
      ws.onopen = () => setState(`en vivo · ${stageId}`, true);
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.original) pushCaption(data);
        } catch (_) { /* ignore */ }
      };
      ws.onclose = () => {
        setState("desconectado · reintentando", false);
        reconnectTimer = setTimeout(connect, 1200);
      };
      ws.onerror = () => { /* onclose se encarga */ };
    }

    function ensureOption(value) {
      const exists = Array.from(stageSelect.options).some((o) => o.value === value);
      if (!exists && value && value !== "__custom") {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = value + " (activo)";
        stageSelect.insertBefore(opt, stageSelect.querySelector('option[value="__custom"]'));
      }
    }

    async function refreshStages() {
      try {
        const res = await fetch("/api/stages");
        const data = await res.json();
        (data.stages || []).forEach((s) => ensureOption(s.stage_id));
      } catch (_) { /* ignore */ }
    }

    function hydrateFromUrl() {
      const stage = params.get("stage");
      const lang = params.get("lang");
      const order = params.get("order");
      if (lang && ["both", "original", "translated"].includes(lang)) {
        langSelect.value = lang;
      }
      if (order && ["original_first", "translated_first"].includes(order)) {
        orderSelect.value = order;
      }
      applyLang(langSelect.value);
      applyOrder(orderSelect.value);
      if (stage) {
        if (DEFAULT_STAGES.includes(stage)) {
          stageSelect.value = stage;
        } else {
          ensureOption(stage);
          if (!Array.from(stageSelect.options).some((o) => o.value === stage)) {
            stageSelect.value = "__custom";
            stageCustom.style.display = "block";
            stageCustom.value = stage;
          } else {
            stageSelect.value = stage;
          }
        }
      }
      setObs(params.get("obs") === "1", false);
    }

    stageSelect.addEventListener("change", () => {
      stageCustom.style.display = stageSelect.value === "__custom" ? "block" : "none";
      connect();
    });
    stageCustom.addEventListener("change", connect);
    langSelect.addEventListener("change", () => {
      applyLang(langSelect.value);
      const next = new URL(location.href);
      next.searchParams.set("lang", langSelect.value);
      history.replaceState(null, "", next);
    });
    orderSelect.addEventListener("change", () => {
      applyOrder(orderSelect.value);
      const next = new URL(location.href);
      next.searchParams.set("order", orderSelect.value);
      history.replaceState(null, "", next);
    });
    $("obsToggle").addEventListener("click", () => {
      setObs(!document.body.classList.contains("obs"), true);
    });

    hydrateFromUrl();
    refreshStages();
    setInterval(refreshStages, 8000);
    connect();
  </script>
</body>
</html>
