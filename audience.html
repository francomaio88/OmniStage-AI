<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OmniStage AI · Audiencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e1116;
      --bg-card: #171c24;
      --ink: #f4efe4;
      --muted: #9a9284;
      --gold: #e8b86d;
      --line: #2a3140;
      --live: #3dcea8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 90% -20%, #1d2a22 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      width: min(860px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 .35rem;
    }
    h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 .35rem; }
    .lede { color: var(--muted); margin: 0 0 1.4rem; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: .35rem;
    }
    select, input[type="text"] {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 10px;
      padding: .65rem .75rem;
      font: 500 .95rem "IBM Plex Sans", sans-serif;
    }
    button {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: 999px;
      padding: .68rem 1rem;
      font: 600 .85rem "IBM Plex Sans", sans-serif;
      cursor: pointer;
      align-self: end;
      height: 42px;
    }
    .status {
      font-family: "IBM Plex Mono", monospace;
      font-size: .75rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .dot {
      width: .5rem; height: .5rem; border-radius: 50%;
      display: inline-block; background: #555; margin-right: .35rem;
    }
    .dot.on { background: var(--live); box-shadow: 0 0 8px var(--live); }
    .board {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 52vh;
      padding: 1.2rem 1.3rem;
    }
    .empty { color: var(--muted); margin: 0; }
    .item { margin: 0 0 1.15rem; }
    .item:last-child { margin-bottom: 0; }
    .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: .7rem;
      color: var(--gold);
      margin-bottom: .25rem;
    }
    .orig { font-size: 1.2rem; line-height: 1.45; margin: 0 0 .25rem; }
    .tr { font-size: 1.02rem; line-height: 1.45; margin: 0; color: #c9c1b3; }
    body[data-lang="original"] .tr,
    body[data-lang="translated"] .orig { display: none; }
    footer { margin-top: 1.2rem; color: var(--muted); font-size: .78rem; }
    footer a { color: var(--gold); }

    /* Variante Browser Source / OBS Studio */
    body.obs {
      background: transparent !important;
      overflow: hidden;
    }
    body.obs .wrap { width: min(1100px, calc(100% - 1.2rem)); padding: 0.4rem 0; }
    body.obs header,
    body.obs .toolbar,
    body.obs .status,
    body.obs footer,
    body.obs .empty { display: none !important; }
    body.obs .board {
      background: transparent;
      border: 0;
      min-height: 0;
      padding: 0;
    }
    body.obs .item { margin-bottom: .85rem; }
    body.obs .orig,
    body.obs .tr {
      color: #fff;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, .95),
        0 0 10px rgba(0, 0, 0, .85),
        2px 2px 0 rgba(0, 0, 0, .55);
    }
    body.obs .meta {
      color: #ffe4a8;
      text-shadow: 0 1px 2px #000, 0 0 8px #000;
    }
    body.obs .orig { font-size: clamp(1.4rem, 3.4vw, 2.3rem); font-weight: 600; }
    body.obs .tr { font-size: clamp(1.1rem, 2.6vw, 1.7rem); color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="kicker">OmniStage AI · Audiencia</p>
      <h1>Transcripción en vivo</h1>
      <p class="lede">Elegí el escenario y cómo querés leer. El modo OBS deja el fondo transparente para usarlo como Browser Source.</p>
    </header>

    <div class="toolbar">
      <div>
        <label for="stage">Escenario</label>
        <select id="stage">
          <option value="nerdearla-main" selected>nerdearla-main</option>
          <option value="nerdearla-sala-2">nerdearla-sala-2</option>
          <option value="nerdearla-workshop">nerdearla-workshop</option>
          <option value="__custom">Otro (escribir abajo)</option>
        </select>
        <input id="stageCustom" type="text" placeholder="stage_id personalizado" style="display:none;margin-top:.45rem"/>
      </div>
      <div>
        <label for="lang">Idioma</label>
        <select id="lang">
          <option value="both" selected>Ambos</option>
          <option value="original">Original</option>
          <option value="translated">Traducido</option>
        </select>
      </div>
      <button id="obsToggle" type="button">Modo OBS</button>
    </div>

    <p class="status"><i class="dot" id="dot"></i><span id="state">Sin conexión</span></p>

    <section class="board" id="board" aria-live="polite">
      <p class="empty" id="empty">Esperando al emisor de este escenario…</p>
    </section>

    <footer>
      Emisor: <a href="/broadcaster">/broadcaster</a>
      · OBS: agregá <code>?obs=1&amp;stage=nerdearla-main&amp;lang=both</code> a esta URL.
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const DEFAULT_STAGES = ["nerdearla-main", "nerdearla-sala-2", "nerdearla-workshop"];

    const stageSelect = $("stage");
    const stageCustom = $("stageCustom");
    const langSelect = $("lang");
    const board = $("board");
    const empty = $("empty");

    let ws = null;
    let reconnectTimer = null;
    let currentStage = "";

    function applyLang(value) {
      document.body.dataset.lang = value;
    }

    function currentStageId() {
      if (stageSelect.value === "__custom") {
        return (stageCustom.value || "default").trim();
      }
      return stageSelect.value;
    }

    function setObs(on, pushUrl) {
      document.body.classList.toggle("obs", on);
      $("obsToggle").textContent = on ? "Salir de OBS" : "Modo OBS";
      if (pushUrl) {
        const next = new URL(location.href);
        if (on) next.searchParams.set("obs", "1");
        else next.searchParams.delete("obs");
        next.searchParams.set("stage", currentStageId());
        next.searchParams.set("lang", langSelect.value);
        history.replaceState(null, "", next);
      }
    }

    function setState(text, on) {
      $("state").textContent = text;
      $("dot").classList.toggle("on", !!on);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function pushCaption(msg) {
      if (!msg.original) return;
      empty.style.display = "none";
      const item = document.createElement("article");
      item.className = "item";
      const when = msg.ts ? new Date(msg.ts * 1000).toLocaleTimeString() : "";
      item.innerHTML = `
        <div class="meta">${escapeHtml(msg.stage_id || "")} · ${escapeHtml(msg.source_lang || "")}→${escapeHtml(msg.target_lang || "")} · ${when}</div>
        <p class="orig">${escapeHtml(msg.original)}</p>
        <p class="tr">${escapeHtml(msg.translated || "")}</p>
      `;
      board.appendChild(item);
      while (board.querySelectorAll(".item").length > 60) {
        const first = board.querySelector(".item");
        if (first) first.remove();
      }
      item.scrollIntoView({ block: "end", behavior: "smooth" });
    }

    function wsUrl(stageId) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return `${proto}://${location.host}/ws/audience/${encodeURIComponent(stageId)}`;
    }

    function disconnect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (ws) {
        ws.onclose = null;
        try { ws.close(); } catch (_) { /* ignore */ }
        ws = null;
      }
    }

    function connect() {
      const stageId = currentStageId();
      currentStage = stageId;
      disconnect();
      setState(`conectando a ${stageId}…`, false);
      ws = new WebSocket(wsUrl(stageId));
      ws.onopen = () => setState(`en vivo · ${stageId}`, true);
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.original) pushCaption(data);
        } catch (_) { /* ignore */ }
      };
      ws.onclose = () => {
        setState("desconectado · reintentando", false);
        reconnectTimer = setTimeout(connect, 1200);
      };
      ws.onerror = () => { /* onclose se encarga */ };
    }

    function ensureOption(value) {
      const exists = Array.from(stageSelect.options).some((o) => o.value === value);
      if (!exists && value && value !== "__custom") {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = value + " (activo)";
        stageSelect.insertBefore(opt, stageSelect.querySelector('option[value="__custom"]'));
      }
    }

    async function refreshStages() {
      try {
        const res = await fetch("/api/stages");
        const data = await res.json();
        (data.stages || []).forEach((s) => ensureOption(s.stage_id));
      } catch (_) { /* ignore */ }
    }

    function hydrateFromUrl() {
      const stage = params.get("stage");
      const lang = params.get("lang");
      if (lang && ["both", "original", "translated"].includes(lang)) {
        langSelect.value = lang;
      }
      applyLang(langSelect.value);
      if (stage) {
        if (DEFAULT_STAGES.includes(stage)) {
          stageSelect.value = stage;
        } else {
          ensureOption(stage);
          if (!Array.from(stageSelect.options).some((o) => o.value === stage)) {
            stageSelect.value = "__custom";
            stageCustom.style.display = "block";
            stageCustom.value = stage;
          } else {
            stageSelect.value = stage;
          }
        }
      }
      setObs(params.get("obs") === "1", false);
    }

    stageSelect.addEventListener("change", () => {
      stageCustom.style.display = stageSelect.value === "__custom" ? "block" : "none";
      connect();
    });
    stageCustom.addEventListener("change", connect);
    langSelect.addEventListener("change", () => {
      applyLang(langSelect.value);
      const next = new URL(location.href);
      next.searchParams.set("lang", langSelect.value);
      history.replaceState(null, "", next);
    });
    $("obsToggle").addEventListener("click", () => {
      setObs(!document.body.classList.contains("obs"), true);
    });

    hydrateFromUrl();
    refreshStages();
    setInterval(refreshStages, 8000);
    connect();
  </script>
</body>
</html>
